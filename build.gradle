plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('runServer').configure {
    standardInput = System.in
}

tasks.register('inspectArchive', JavaExec) {
    group = 'verification'
    description = 'Fully verifies a DreamingRecall archive supplied with -Parchive=<directory>.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.hhy.dreamingrecall.tools.ArchiveInspectorMain'
    if (providers.gradleProperty('archive').isPresent()) {
        args providers.gradleProperty('archive').get()
    }
}

tasks.register('inspectReplayState', JavaExec) {
    group = 'verification'
    description = 'Decodes and materializes a DreamingRecall archive supplied with -Parchive=<directory>.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.hhy.dreamingrecall.tools.ReplayStateInspectorMain'
    if (providers.gradleProperty('archive').isPresent()) {
        args providers.gradleProperty('archive').get(), minecraft_version
        if (providers.gradleProperty('time').isPresent()) {
            args providers.gradleProperty('time').get()
        }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    filteringCharset = 'UTF-8'
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_description         : 'A server-global, randomly accessible replay system for NeoForge.',
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
